name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Test and build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}"
          assert f"## [{version}] - Unreleased" not in Path("CHANGELOG.md").read_text()
          PY

      - name: Verify published release for manual recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name' \
            | grep -Fx "$RELEASE_TAG"

      - name: Test, build, and inspect distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build twine
          pytest -q
          ruff check .
          mypy agent_gorgon agent_warden
          python -m build
          python -m twine check dist/*

      - name: Verify wheel in an isolated environment
        shell: bash
        run: |
          python -m venv /tmp/agent-gorgon-release-smoke
          /tmp/agent-gorgon-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/agent-gorgon-release-smoke/bin/python -m pip check
          /tmp/agent-gorgon-release-smoke/bin/agent-gorgon --help >/dev/null
          /tmp/agent-gorgon-release-smoke/bin/agent-gorgon-forensic --help >/dev/null
          /tmp/agent-gorgon-release-smoke/bin/agent-warden --help >/dev/null
          /tmp/agent-gorgon-release-smoke/bin/agent-warden-forensic --help >/dev/null
          /tmp/agent-gorgon-release-smoke/bin/python - <<'PY'
          import agent_gorgon
          from agent_gorgon.warden import Scope as CanonicalScope
          from pathlib import Path
          import tomllib
          from agent_warden.warden import Scope as LegacyScope

          expected = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert agent_gorgon.__version__ == expected
          import agent_warden
          assert agent_warden.__version__ == expected
          assert CanonicalScope is LegacyScope
          PY

      - name: Exercise the installed audit-only starter path
        shell: bash
        run: |
          demo_dir="$(mktemp -d /tmp/agent-gorgon-demo.XXXXXX)"
          ln -s "$(command -v sleep)" "$demo_dir/wget"
          /bin/sh -c '"$1" 3 & wait' agent-demo "$demo_dir/wget" &
          target_pid=$!
          /tmp/agent-gorgon-release-smoke/bin/agent-gorgon \
            --scope starter \
            --agent-pid "$target_pid" \
            --poll 0.05 \
            --no-llm \
            --audit-only \
            --log-dir "$demo_dir/evidence" 2>&1 | tee "$demo_dir/run.log"
          grep -F "would HALT: Suspicious process spawned: wget" "$demo_dir/run.log"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
