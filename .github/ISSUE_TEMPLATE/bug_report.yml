name: Bug Report
description: Report a bug in agent-warden
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug. Do not paste secrets, API keys, private policy scopes, or sensitive forensic logs.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `agent-warden --scope ...`
        2. See error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agent-warden Version
      description: "Output of `pip show agent-warden | grep Version`"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python Version
      description: "Output of `python --version`"
      placeholder: "3.12.0"
    validations:
      required: true
