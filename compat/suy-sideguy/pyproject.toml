[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suy-sideguy"
version = "0.1.6"
description = "Temporary compatibility shim for the agent-gorgon distribution."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Rolando Bosch" }]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["agent-gorgon==0.1.6"]

[project.scripts]
suy-warden = "suy_sideguy._compat_cli:warden"
suy-forensic-report = "suy_sideguy._compat_cli:forensic_report"

[project.urls]
Homepage = "https://github.com/hermes-labs-ai/agent-gorgon"
Repository = "https://github.com/hermes-labs-ai/agent-gorgon"
Documentation = "https://github.com/hermes-labs-ai/agent-gorgon#readme"
Issues = "https://github.com/hermes-labs-ai/agent-gorgon/issues"

[tool.setuptools.packages.find]
where = ["src"]
