[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-warden"
version = "0.1.5"
description = "Runtime policy guard for autonomous AI agents with user-space enforcement and forensic reporting."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{ name = "Rolando Bosch" }]
keywords = ["runtime-agent-guard", "ai-agent-security", "runtime-monitoring", "incident-response", "policy-enforcement", "forensics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "psutil>=5.9",
  "PyYAML>=6.0.3",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.2",
  "ruff>=0.15.15",
  "mypy>=1.19.1",
  "types-PyYAML>=6.0.12.20250915",
]

[project.scripts]
agent-warden = "agent_warden.warden:entrypoint"
agent-warden-forensic = "agent_warden.forensic_report:main"

[project.urls]
Homepage = "https://github.com/hermes-labs-ai/agent-warden"
Repository = "https://github.com/hermes-labs-ai/agent-warden"
Documentation = "https://github.com/hermes-labs-ai/agent-warden#readme"
Issues = "https://github.com/hermes-labs-ai/agent-warden/issues"
Changelog = "https://github.com/hermes-labs-ai/agent-warden/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["agent_warden"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
files = ["agent_warden"]
ignore_missing_imports = true
warn_unused_ignores = true
