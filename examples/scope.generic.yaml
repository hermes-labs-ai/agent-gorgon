# Generic starter scope for agent-warden.
# NOTE: the Scope parser reads the NESTED schema below (filesystem/network/
# process/behavior). A flat schema (allow_read/deny_write/deny_exec) is NOT
# recognized; the warden rejects it instead of silently enforcing nothing.

agent:
  name: "my-agent"
  pid: null

filesystem:
  allowed_paths:
    - "~/agent-workspace/**"
    - "/tmp/**"
    - "/workspace/**"
  forbidden_paths:
    - "~/.ssh/**"
    - "~/.gnupg/**"
    - "~/.aws/**"
    - "~/.config/gcloud/**"
    - "~/.config/gh/**"
  forbidden_extensions:
    - ".pem"
    - ".key"
    - ".p12"
    - ".keychain"
    - ".keychain-db"

network:
  # The built-in observer emits remote IPs, not authenticated hostnames.
  # Hostname entries apply only to integrations that supply a hostname.
  allowed_domains:
    - "localhost"
    - "127.0.0.1"
    - "api.openai.com"
    - "api.anthropic.com"
    - "pypi.org"
    - "files.pythonhosted.org"
    - "registry.npmjs.org"
    - "github.com"
    - "api.github.com"
  forbidden_domains:
    - "pastebin.com"
    - "hastebin.com"
    - "transfer.sh"
    - "file.io"
    - "0x0.st"
  allowed_ports:
    - 80
    - 443
    - 53

process:
  # Built-in child observation applies the curl/wget uncertainty HALT before
  # ordinary command-scope evaluation. Other exact forbidden commands KILL.
  allowed_commands:
    - "bash"
    - "sh"
    - "zsh"
    - "python3"
    - "python"
    - "node"
    - "npm"
    - "npx"
    - "git"
    - "ls"
    - "cat"
    - "echo"
    - "grep"
    - "sed"
    - "awk"
    - "jq"
    - "find"
  forbidden_commands:
    - "curl"
    - "wget"
    - "ssh"
    - "scp"
    - "rsync"
    - "sudo"
    - "pkill"
    - "killall"

behavior:
  flag_threshold: 5
  flag_window: 60
  max_actions_per_minute: 60
